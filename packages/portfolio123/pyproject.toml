[project]
name = "quant-engine-portfolio123"
version = "0.2.0"
description = "HAR-first Portfolio123 capability routing for quant_engine."
requires-python = ">=3.11,<3.14"
dependencies = [
  "pyarrow==23.0.1",
  "quant-engine-core",
  "quant-engine-web-contract-harvester",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_engine.portfolio123"
