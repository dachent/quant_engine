[project]
name = "quant-engine-web-contract-harvester"
version = "0.1.0"
description = "Fail-closed web-contract sanitization and extraction for quant_engine."
requires-python = ">=3.11,<3.14"
dependencies = ["quant-engine-core"]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_engine.web_contracts"
