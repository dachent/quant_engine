[project]
name = "quant-engine-schwab"
version = "0.1.0"
description = "Read-only Schwab history and generation contracts for quant_engine."
requires-python = ">=3.11,<3.14"
dependencies = ["quant-engine-core", "quant-engine-portfolio-ledger"]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_engine.schwab"
