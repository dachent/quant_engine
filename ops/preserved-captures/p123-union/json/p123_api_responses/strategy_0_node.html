

<script type="text/javascript">
$(function(){
	$("#form-node-update").validate();

	$('[data-toggle="popover"]').popover();

	if ($('#button-paste').length && !rankSystTree.clipboard)
		{ $('#button-paste').attr('disabled', 'disabled'); }

	if ($('#id').val() == -1)
		{ $('#parent').val( rankSystTree.selectedNodeId ); }

	
		
		
	

	
	
		if($('#var-short-desc').length)
		{
			$('#var-short-desc').html(findDescription('VladsNewGrowth 45.0'));
		}
	

	
	

	if($('#button-paste').length && rankSystTree.clipboard!=null)
		{ $('#button-paste').removeAttr('disabled'); }
});
</script>

<form id="form-node-update" action class="form-horizontal" onsubmit="return false">

	<input type="hidden" id="id" name="id" value="0" />
	<input type="hidden" id="parent" name="parent" />


	<h3 class="clearfix form-inline" style="margin: 10px 0 5px 0">
		
		<div class="pull-right">


			
				<select id="node-action" class="form-control input-sm" style="width:150px" onchange="rankSystTree.nodeActionSelectChange(0)">
					<option value="-1" selected="true">Copy & Paste</option>
						
					
						
					
						
					
						<option value="3" id="button-copy">&raquo; Copy</option>
					
						
					
						<option value="4" id="button-copysub">&raquo; Copy Sub-nodes</option>
					
						
					
				</select>
			



			


			
				<input type="button" class="btn btn-primary btn-sm" value="Update" id="button" name="button"
					   disabled="true"
					   onclick="
					   
							   if ($('#form-node-update').valid())
							   { ajaxSubmit($('#form-node-update'), '/app/ranking-system/70429/node-save', rankSystTree.nodeAddUpdate); }
							   " />
				<img src="/images/ajax-loader-trans16.gif" id="loader" style="vertical-align:middle; display: none" />
			

		</div>
	
		
		
			Composite
			
			
			
			
			
		
		
	</h3>
	<hr class="p123HR"/>




	<div class="row">
		
			<div class="col-sm-6">
				<div class="pad-b txt-medium">
					Ranking
					
				</div>
				<div id="input-group1">
					<label>
						<input type="radio" name="mode" id="mode0" value="0" class="check"  />
						<span data-toggle="popover" data-trigger="hover" data-html="true" data-placement="bottom" data-container="body" title="Lower values are better" data-content="Weighted subranks are added, sorted from low to high and assigned a percentile score&lt;br&gt;(this last operation normalizes the values to 100-0)">
							<img src="/images/dnarrow.gif" alt="Lower values are better" /> Lower values
						</span>
					</label>
					<br />
					<label>
					<input type="radio" name="mode" id="mode1" value="1" class="check" checked />
						<span data-toggle="popover" data-trigger="hover" data-html="true" data-placement="bottom" data-container="body" title="Higher values are better" data-content="Weighted subranks are added, sorted from high to low and assigned a percentile score&lt;br&gt;(this last operation normalizes the values to 100-0)">
							<img src="/images/uparrow.gif" alt="Higher values are better" /> Higher values
						</span>
					</label>
					
						<br />
						<label>
							<input type="radio" name="mode" id="mode2" value="2" class="check"  />
							<span class="tip" data-toggle="popover" data-trigger="hover" data-html="true" data-placement="bottom" data-container="body" title="Summation only" data-content="The composite rank is simply the weighted sum of the subranks&lt;br&gt;(the range of value may not be 100-0)">
								<img src="/images/summation.gif" alt="Summation only" /> Summation only
							</span>
						</label>
					
					
				</div>
			</div>
		


		
			
			
			
		
	</div>
	<hr class="p123HR"/>



	<div id="node-properties">

					</div>
				</div>

				
			
			
		
	</div>


	

</form>
