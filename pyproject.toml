[project]
name = "quant-engine-workspace"
version = "0.0.0"
description = "Private governed workspace for quant_engine."
requires-python = ">=3.11,<3.14"
dependencies = ["xlsxwriter>=3.2,<4"]

[project.optional-dependencies]
market-data = [
  "pandas>=2.2,<4",
  "yfinance>=1.2,<2",
]

[dependency-groups]
dev = [
  "mypy>=2.3,<2.4",
  "pandas>=2.2,<4",
  "pytest>=9.1,<9.2",
  "pytest-socket>=0.7,<0.8",
  "quant-engine-ci-controls",
  "quant-engine-core",
  "quant-engine-fidelity",
  "quant-engine-ibkr",
  "quant-engine-matrixport",
  "quant-engine-portfolio-ledger",
  "quant-engine-schwab",
  "quant-engine-web-contract-harvester",
  "ruff==0.15.22",
  "types-PyYAML>=6.0.12,<7",
]

[tool.uv]
package = false
required-version = ">=0.11.28,<0.12"

[tool.uv.workspace]
members = ["apps/schwab-trading", "packages/ci-controls", "packages/core", "packages/fidelity", "packages/ibkr", "packages/matrixport", "packages/portfolio-ledger", "packages/schwab", "packages/web-contracts"]

[tool.uv.sources]
quant-engine-ci-controls = { workspace = true }
quant-engine-core = { workspace = true }
quant-engine-fidelity = { workspace = true }
quant-engine-ibkr = { workspace = true }
quant-engine-matrixport = { workspace = true }
quant-engine-portfolio-ledger = { workspace = true }
quant-engine-schwab = { workspace = true }
quant-engine-web-contract-harvester = { workspace = true }

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--maxfail=1",
  "-p",
  "no:cacheprovider",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = ["packages/ci-controls/src", "packages/core/src", "packages/fidelity/src", "packages/ibkr/src", "packages/matrixport/src", "packages/portfolio-ledger/src", "packages/schwab/src", "packages/web-contracts/src"]
incremental = false
pretty = true
show_error_codes = true
warn_unused_configs = true
