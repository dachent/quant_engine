# Credential-free example only. Copy to an ignored local configuration and
# keep all real identifiers, provider values, and user-specific absolute paths
# out of Git. Relative roots resolve from the repository worktree. In an isolated
# checkout, configure the existing governed roots explicitly in the ignored local
# configuration or command arguments; do not create replacement data roots.
schema_version = 1
environment = "offline"

[runtime]
allow_network = false
allow_metered_access = false
allow_external_writes = false

[paths]
source_specifications = "../xBin"
portfolio123 = "../dataPortfolio123"
matrixport = "../dataMatrixport"
quantbase = "../dataQuantbase"
schwab = "../dataSchwab"
ibkr = "../dataIBKR"
fidelity = "../dataFidelity"
alpaca = "../dataAlpaca"
portfolio = "../dataPortfolio"
restricted_identity_crosswalk = ""

[credentials]
provider = "windows-credential-manager"
reference_prefix = "quant_engine/"
literal_fallback_allowed = false

[web_contracts]
persist_authenticated_capture = false
api_fallback_enabled = false

[broker]
environment = "DRY_RUN"
submission_enabled = false
paper_enabled = false
live_enabled = false

[publication]
pointer_updates_enabled = false
