# Governed secrets of the synthetic-fixture generator (issue 696): they live in the data
# root only; the salt inverts the synthetic mapping and the spec lists the real values.
forbidden_basenames = [
  "salt.txt",
  "spec.json",
  "fixture-salt.txt",
  "fixture-spec.json",
]

