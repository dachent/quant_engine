# Add no [[synthetic_fixture]] table until a governing issue approves one exact
# wholly synthetic file. Omission is the valid empty allowlist.

[endpoint_policy]
default_decision = "DENY"
allowed_semantic_effects = ["READ_ONLY"]
approved_terms_states = ["APPROVED"]
required_fields = [
  "provider",
  "capability",
  "method",
  "path_matcher",
  "semantic_effect",
  "terms_state",
  "credential_class",
  "approval_requirement",
]
allowed_optional_fields = ["name", "id", "credential_source"]
allowed_credential_classes = ["NONE", "OS_CREDENTIAL_REFERENCE", "SECRET_MANAGER_REFERENCE"]
forbidden_credential_classes = [
  "LITERAL",
  "EMBEDDED",
  "PLAINTEXT",
  "CAPTURED_SESSION",
  "UNKNOWN",
]
allowed_approval_requirements = ["GOVERNING_ISSUE"]
approval_required_effects = [
  "METERED_READ",
  "QUOTE_PRODUCING",
  "PROVIDER_MUTATION",
  "ORDER_SUBMISSION",
  "ORDER_CANCELLATION",
  "ASSET_TRANSFER",
  "DESTRUCTIVE",
  "PAPER_ORDER",
  "LIVE_ORDER",
  "UNKNOWN",
]
