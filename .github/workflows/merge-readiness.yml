name: Merge readiness

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed, edited]
  issue_comment:
    types: [created]
  check_run:
    types: [completed]

permissions:
  contents: read
  pull-requests: read
concurrency:
  group: merge-readiness-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  readiness:
    # Skip non-PR contexts (issue_comment/check_run fire on the default branch too).
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event.pull_request.number != null ||
      github.event.check_run.check_suite.pull_requests.size > 0
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compute merge readiness
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.check_run.check_suite.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No associated pull request; nothing to check."
            exit 0
          fi
          echo "Computing merge readiness for PR $PR_NUMBER"
          python tools/merge_readiness.py "$PR_NUMBER"
