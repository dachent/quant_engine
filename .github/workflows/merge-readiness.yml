name: Merge readiness

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR to check (run with --ref <pr-head-sha> so the result attaches to the PR)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-readiness-${{ github.event.pull_request.number || github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compute merge readiness
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request context or pr_number input; nothing to check."
            exit 0
          fi
          echo "Computing merge readiness for PR $PR_NUMBER"
          python tools/merge_readiness.py "$PR_NUMBER"
