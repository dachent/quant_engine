name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Backstop only: hangs are caught by the per-test timeout and the stall watchdog,
    # so a slow runner no longer cancels a required check.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Delivery runtime is Windows / CPython 3.11.15 on this workstation and there are no
        # downstream installers, so the other five combinations validated a promise nothing
        # consumes. Measured on run 35791363435: six jobs cost 126 min compute and ~57 min
        # wall clock at max-parallel 3; this one costs ~31. requires-python still allows
        # >=3.11,<3.14 -- narrowing it forces a uv.lock regeneration that would change the
        # dependency set the release candidate is built against.
        os: [windows-2025]
        python-version: ["3.11"]
    env:
      UV_LINK_MODE: copy
      UV_NO_PROGRESS: "1"
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Prove lock is current
        run: uv lock --check
      - name: Install the frozen workspace
        run: uv sync --frozen --all-groups --all-packages --python "${{ matrix.python-version }}"
      - name: Install pinned Node for browser tests
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Install locked browser test runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
          NPM_CONFIG_CACHE: ${{ runner.temp }}/quant-engine-npm-cache
        run: npm ci --prefix apps/portfolio-control-panel --ignore-scripts --no-audit --no-fund
      - name: Install matching project-local Chromium
        run: node apps/portfolio-control-panel/node_modules/playwright/cli.js install chromium
      - name: Prove browser runtime before the offline suite
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          node --input-type=module -e "import { chromium } from './apps/portfolio-control-panel/node_modules/playwright/index.mjs'; const browser = await chromium.launch({ headless: true }); try { const page = await browser.newPage(); await page.setContent('<p id=proof>browser-ready</p>'); if (await page.locator('#proof').textContent() !== 'browser-ready') throw new Error('browser runtime smoke failed'); } finally { await browser.close(); }"
      - name: Check formatting
        run: uv run --frozen --no-sync ruff format --check .
      - name: Check lint
        run: uv run --frozen --no-sync ruff check .
      - name: Check architecture boundaries
        run: uv run --frozen --no-sync python tools/check_architecture.py
      - name: Type-check CI code
        run: uv run --frozen --no-sync mypy packages/alpaca/src packages/ci-controls/src packages/core/src packages/fidelity/src packages/ibkr/src packages/matrixport/src packages/portfolio-ledger/src packages/portfolio123/src packages/schwab/src packages/turingtrader/src packages/web-contracts/src tools/account_strategy_manifest.py tools/alpaca_generation.py tools/check_repository_boundary.py tools/check_push_policy.py tools/issue_guard.py tools/fidelity_generation.py tools/ibkr_generation.py tools/matrixport_generation.py tools/portfolio123_generation.py tools/schwab_generation.py tools/quantbase_generation.py tools/portfolio_provenance.py tools/provider_ledger.py tools/portfolio_baseline.py tools/portfolio_report.py tools/portfolio_control_panel.py tools/portfolio_decomposition.py tools/portfolio_correlation.py tools/portfolio_counted_producer.py tools/portfolio_diligence_rubric.py tools/portfolio_driver_map.py tools/portfolio_target_series.py tools/portfolio_strategy_history.py tools/portfolio_implementation_reconciliation.py tools/portfolio_implementation_return_attribution.py tools/portfolio_release_builder.py tools/portfolio_pipeline_materialize.py tools/portfolio_controller_graph.py tools/portfolio_financial_mvp_contract.py tools/data_pipeline.py tools/data_recovery_rehearsal.py tools/provider_security_quarantine.py tools/p123_security_quarantine.py tools/verify_portfolio123_skill_installation.py tools/portfolio_attended_preparation.py tools/portfolio_current_decomposition_plan.py tools/portfolio_weekly_returns.py tools/check_gitleaks_suppressions.py tools/ci.py tools/stall_watchdog.py tools/nested_strategy_tag_map.py tools/sleeve_ledger.py tools/sleeve_nav.py tools/sleeve_inputs.py tools/verify_sleeve_ledger.py tools/build_sleeve_account_facts.py tools/build_quantbase_fund_facts.py tools/check_architecture.py tools/check_data_roots.py tools/verify_release_restore.py tools/check_retained_authority_pins.py tools/check_release_validation_findings.py tools/check_release_closure.py tools/codex_scope_guard.py tools/merge_readiness.py tools/portfolio_attribution.py tools/portfolio_current_dependence.py tools/portfolio_decomposition_evidence_modes.py tools/portfolio_designer_model_curve.py tools/portfolio_financial_outcomes.py tools/portfolio_fx_rates.py tools/portfolio_hwm_selected_inputs.py tools/portfolio_invested_capital.py tools/portfolio_private_stage.py tools/portfolio_provider_track_record.py tools/portfolio_public_decomposition_sources.py tools/portfolio_public_style_sources.py tools/portfolio_qc.py tools/portfolio_replication.py tools/portfolio_strategy_backtests.py tools/rebind_current_epoch_crosswalk.py tools/restricted_evidence_summary.py tools/stage_current_epoch_manifest.py tools/static_snapshot_coverage_receipts.py tools/portfolio_freshness.py tools/validate_generation.py tools/validate_release_targets.py tools/holdings_identity.py tools/verify_holdings_identity.py acceptance/derive_a acceptance/validate
      - name: Resolve controller graph change range
        id: controller_graph_range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: python -c "import os, pathlib, subprocess; base = os.getenv('PULL_REQUEST_BASE') if os.environ['EVENT_NAME'] == 'pull_request' else os.getenv('PUSH_BASE'); base = base if base and set(base) != {'0'} else 'EMPTY_TREE'; subprocess.run(['git', 'cat-file', '-e', base + '^{commit}'], check=True) if base != 'EMPTY_TREE' else None; pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8').write('base=' + base + '\n')"
      - name: Validate source-bound controller graph
        run: uv run --frozen --no-sync python tools/portfolio_controller_graph.py --repo-root . --changed-from "${{ steps.controller_graph_range.outputs.base }}" --changed-to "${{ github.sha }}"
      - name: Verify pinned Gitleaks suppression provenance
        run: uv run --frozen --no-sync python tools/check_gitleaks_suppressions.py
      - name: Run bounded offline tests
        run: uv run --frozen --no-sync python tools/stall_watchdog.py --stall-seconds 1200 -- python -m pytest -q --disable-socket --durations=20 tests/alpaca tests/security tests/ci tests/core tests/fidelity tests/ibkr tests/market_data tests/matrixport tests/portfolio123 tests/quantbase tests/portfolio_fx_rates tests/portfolio_ledger tests/provider_ledger tests/portfolio_provenance tests/portfolio_baseline tests/portfolio_report tests/portfolio_control_panel tests/portfolio_analytics tests/portfolio_attribution tests/portfolio_operations tests/schwab tests/schwab_app tests/web_contracts tests/governance tests/acceptance
      - name: Run Windows Schwab application continuity tests
        if: runner.os == 'Windows'
        run: uv run --frozen --no-sync pytest -q --disable-socket --allow-hosts=127.0.0.1,localhost apps/schwab-trading/tests
      - name: Build every workspace package
        run: uv build --all-packages --no-sources --python "${{ matrix.python-version }}"
